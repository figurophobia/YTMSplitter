name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove any cookies,
        tokens or personal data from logs before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ytmsplitter ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant output. Remove secrets first.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: YTMSplitter version
      description: Output of `ytmsplitter --version`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, and whether you used the chips or AI engine.
    validations:
      required: true
